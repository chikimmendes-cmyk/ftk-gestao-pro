<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15191f">
<link rel="manifest" href="./manifest.webmanifest">
<title>FTK Gestão Pro</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111419;color:#f4f6f8;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}.card{max-width:560px;width:100%;background:#171d24;border:1px solid #36404b;border-radius:18px;padding:20px;box-shadow:0 18px 50px #0007}h1{font-size:22px;margin:0 0 8px}.muted{color:#aab4bf;font-size:13px;line-height:1.5}.btn{display:inline-flex;align-items:center;justify-content:center;background:#f08a24;color:#111;border:0;border-radius:12px;padding:12px 16px;font-weight:800;text-decoration:none;margin-top:14px}.err{color:#ffb1a8;white-space:pre-wrap;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="card" id="status"><h1>FTK Gestão Pro</h1><div class="muted">Carregando o aplicativo...</div></div>
<script>
const DB='ftk-pwa-shell-v1',STORE='app',KEY='html';
const BACKEND='https://lkwsnfiblwqjcnewvfsy.supabase.co/functions/v1/ftk-push';
function openDb(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function getHtml(){const d=await openDb();return new Promise((ok,no)=>{const t=d.transaction(STORE,'readonly'),r=t.objectStore(STORE).get(KEY);r.onsuccess=()=>ok(r.result||'');r.onerror=()=>no(r.error)})}
function patch(html){return String(html).replaceAll('__FTK_PUSH_BACKEND_URL__',BACKEND)}
function boot(html){const fixed=patch(html);document.open();document.write(fixed);document.close()}
(async()=>{try{if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(console.warn);const html=await getHtml();if(html){boot(html);return}location.replace('./setup.html')}catch(e){document.querySelector('#status').innerHTML='<h1>FTK Gestão Pro</h1><div class="muted">Não foi possível abrir o aplicativo.</div><div class="err">'+String(e)+'</div><a class="btn" href="./setup.html">Configurar FTK</a>'}})();
</script>
</body></html>
